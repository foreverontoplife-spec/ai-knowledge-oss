name: backup-check
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 front matter / 重复 id / 密钥 / 压缩包
        run: python scripts/check_backup.py . | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
